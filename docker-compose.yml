# Job Tracker: PostgreSQL + API + UI.
#
# One-time:  cp .env.example .env   (then set a password in .env, which is git-ignored)
#
# Run everything:    docker compose up -d --build     -> open http://localhost:8080
# Develop locally:   docker compose up -d db          -> run the API (dotnet run) and UI (npm run dev) yourself
#
# Data lives in the named volume "jobtracker-data": it survives restarts and "docker compose down".
# Only "docker compose down -v" deletes it.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
    ports:
      # Published for the local "develop" mode; bound to localhost so other machines can't reach it.
      - "127.0.0.1:5432:5432"
    volumes:
      - jobtracker-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # "db" is the database service's name on the compose network. GSS (Kerberos) encryption is off: the
      # slim runtime image has no Kerberos library and the database is only reachable on the compose network.
      ConnectionStrings__JobTracker: Host=db;Port=5432;Database=${POSTGRES_DB:-jobtracker};Username=${POSTGRES_USER:-jobtracker};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      # Optional: without it the app runs and AI analysis reports "not configured".
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # No published port: the API is only reachable through the web container's /api proxy.

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

  # MCP server for Claude. Not started by "docker compose up" (the "mcp" profile keeps it out): it talks
  # stdio, so Claude launches it per session with
  #   docker run -i --rm --network job-tracker_default job-tracker-mcp
  # Build or rebuild the image with: docker compose build mcp
  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    image: job-tracker-mcp
    profiles: ["mcp"]

volumes:
  jobtracker-data:
