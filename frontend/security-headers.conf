# Security headers, included in the server block and in every location that sets its own add_header
# (nginx drops inherited add_header lines in any block that declares one of its own).
#
# CSP: the built app loads scripts, styles, fonts and API calls from its own origin only, and has no inline
# scripts or styles; images may also be data: URIs (the inlined logo). No plugins, no framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# External job-post links only learn the site's origin, never the application page URL.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
