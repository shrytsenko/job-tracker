<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <!-- Градієнт для іконки (адаптований під свіжий зелений/м'ятний акцент або залишений стильним фірмовим) -->
    <linearGradient id="pineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" /> <!-- Deep Pine Green -->
      <stop offset="100%" stop-color="#34D399" /> <!-- Mint/Emerald -->
    </linearGradient>
    
    <!-- М'яка тінь -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#059669" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Іконка портфеля з галочкою -->
  <g transform="translate(10, 10)" filter="url(#softShadow)">
    <rect x="0" y="20" width="80" height="60" rx="14" fill="url(#pineGradient)" />
    <path d="M 25 20 V 13 A 7 7 0 0 1 55 13 V 20" fill="none" stroke="url(#pineGradient)" stroke-width="6" stroke-linecap="round" />
    <path d="M 23 50 L 35 62 L 59 34" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Текстова частина: використовує currentColor для автоматичної адаптації під темну/світлу тему -->
  <g transform="translate(115, 63)">
    <!-- "Job" — реагує на колір тексту у вашій темі (чорний у світлій, білий у темній) -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="currentColor" letter-spacing="-1">Job</text>
        
    <!-- "Tracker" — залишається у фірмовому зеленому акценті вашого додатку -->
    <text x="88" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="400" fill="#059669" letter-spacing="-1">Tracker</text>
  </g>
</svg>