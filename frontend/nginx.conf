# Serves the built UI and forwards /api to the API container — the same single-origin setup as the
# Vite dev proxy, so the API needs no CORS configuration.
server {
    listen 8080;
    root /usr/share/nginx/html;
    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # Applies to /api/ (which sets no headers of its own); the locations below include it again.
    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI job analysis can take a while; nginx's default 60 s would cut it off.
        proxy_read_timeout 180s;
        # Request bodies are small JSON; this caps oversized uploads before they reach the API.
        client_max_body_size 1m;
    }

    # Hashed build files never change, so they can be cached for a long time.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/applications/..., /dashboard) all load index.html; React Router takes it from there.
    # index.html itself is never cached, so a new deploy is picked up on the next load.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
