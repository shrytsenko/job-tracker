<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Фірмовий зелений градієнт фону, що збігається з логотипом -->
    <linearGradient id="favPineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Закруглена підкладка (ідеально для табів у будь-якому браузері) -->
  <rect width="64" height="64" rx="16" fill="url(#favPineGradient)" />

  <!-- Білий силует портфеля для максимального контрасту -->
  <rect x="14" y="24" width="36" height="26" rx="6" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Ручка портфеля -->
  <path d="M 24 24 V 20 A 8 8 0 0 1 40 20 V 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.95" />

  <!-- Гачок трекінгу (контрастний темно-зелений акцент `#059669` всередині білого портфеля) -->
  <path d="M 22 37 L 29 44 L 42 29" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>