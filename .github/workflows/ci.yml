name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks the code, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the build that is still running for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format + analysis + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      # Code style from .editorconfig: fails if any file would be reformatted (fix locally with "dotnet format").
      - run: dotnet format JobTracker.slnx --verify-no-changes --no-restore

      # Directory.Build.props treats warnings as errors, so a new warning fails the build.
      - run: dotnet build --no-restore --configuration Release

      # Integration tests start a throwaway PostgreSQL with Testcontainers; GitHub's Ubuntu runners have Docker.
      - run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + format + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Prettier: fails if any file is not formatted (fix locally with "npm run format").
      - run: npm run format:check
      # "build" runs the TypeScript compiler first, so type errors fail here.
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Proves both Dockerfiles still build. Nothing is started, so the password is only there because
      # docker-compose.yml requires one to be set; it is not a real secret.
      # --profile mcp also builds the MCP server image, which "docker compose up" never starts.
      - run: docker compose --profile mcp build
        env:
          POSTGRES_PASSWORD: ci-build-only

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci
      # Fast checks first, so a type or style mistake fails before the Docker stack is built.
      - run: npm run typecheck
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium

      # The whole app (PostgreSQL + API + UI) in Docker, as the isolated "job-tracker-e2e" stack from .env.e2e.
      - run: npm run stack:up
      - run: npx playwright test

      - name: Show app logs
        if: failure()
        run: npm run stack:logs

      # HTML report with traces (DOM snapshots, network, console) for any failed test.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npm run stack:down
