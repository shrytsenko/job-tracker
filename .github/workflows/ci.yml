name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks the code, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the build that is still running for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      # Directory.Build.props treats warnings as errors, so a new warning fails the build.
      - run: dotnet build --no-restore --configuration Release

      # Integration tests start a throwaway PostgreSQL with Testcontainers; GitHub's Ubuntu runners have Docker.
      - run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # "build" runs the TypeScript compiler first, so type errors fail here.
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Proves both Dockerfiles still build. Nothing is started, so the password is only there because
      # docker-compose.yml requires one to be set; it is not a real secret.
      - run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-build-only
